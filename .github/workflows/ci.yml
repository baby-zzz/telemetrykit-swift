name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift --version && swift build
      - name: Test
        run: swift test
      - name: SwiftLint
        run: |
          if command -v swiftlint >/dev/null; then swiftlint lint --quiet; else echo "SwiftLint not installed: skipped"; fi
