# Releases with release-please: every push to main updates a release pull request (version, CHANGELOG.md from the
# Conventional Commits); merging it tags vX.Y.Z and creates the GitHub Release. Swift Package Manager resolves the tag
# directly, so there is nothing to upload.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
